# Builds, tests and packages Wovenpage on Windows.
# The installer and the end-to-end screenshots are attached to the run as artifacts.
# Every stage runs even if an earlier one fails, and failures are reported as
# annotations, so one run shows everything that is wrong.
name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Hosted Windows runners start at 1024 x 768, which is smaller than the app's working size.
      - name: Use a desktop-sized display
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit, service and transport tests
        if: ${{ !cancelled() }}
        run: |
          node --import tsx --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test.tap \
            tests/*.test.ts || { node scripts/annotate-failures.mjs test.tap; exit 1; }

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      - name: End-to-end test (drives the real app)
        if: ${{ !cancelled() }}
        run: npm run e2e
        env:
          SHOTS: e2e-screenshots

      - name: Build the installer
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          npm run dist 2>&1 | tee dist.log || { node scripts/annotate-tail.mjs "Installer build" dist.log; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e-screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: Wovenpage-Setup
          path: release/*.exe
          if-no-files-found: warn
